[project]
name = "ytmp3-host"
version = "0.1.0"
description = "Native messaging host for the YouTube MP3 Downloader Firefox extension"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "customtkinter==5.2.2",
    "pyrefly>=0.60.0",
]

[dependency-groups]
dev = [
    "pillow==12.3.0",
    "pyinstaller>=6.22.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["host/src/ytmp3_host"]

[tool.uv]
package = true

[tool.pyrefly]
project-includes = ["host/**/*.py"]
project-excludes = ["legacy/**"]
search-path = ["host/src"]
