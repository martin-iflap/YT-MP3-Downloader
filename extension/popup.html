<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP3 Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
            background: #17181a; /* uniform background */
        }

        body {
            width: 400px;
            min-height: 220px;
            background: #17181a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            color: #e6e6e6;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            text-align: center;
            margin-bottom: 10px;
        }

        /* Card-like area used for the current URL only (remove card around folder) */
        .url-container {
            background: rgba(255,255,255,0.02);
            border-radius: 10px;
            padding: 12px 15px;
            border: 1px solid rgba(255,255,255,0.04);
        }

        /* Folder row should be plain (no boxed card) */
        .folder-row {
            background: transparent;
            padding: 0;
            border: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .url-label, .folder-label {
            font-size: 12px;
            color: #9aa0a6;
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: normal;
        }

        .url-text {
            font-size: 13px;
            color: #dcdfe2;
            word-break: break-all;
            line-height: 1.5;
        }

        /* Inputs styled to match sidebar */
        input[type="text"] {
            width: 100%;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 10px;
            padding: 12px 12px;
            color: #e6e6e6;
            font-size: 13px;
            transition: all 160ms ease;
            outline: none;
            box-shadow: inset 0 -1px 0 rgba(0,0,0,0.25);
        }

        input[type="text"]:focus {
            background: rgba(255,255,255,0.03);
            border-color: rgba(255,255,255,0.08);
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(0,0,0,0.45), 0 0 0 3px rgba(120,130,140,0.03);
        }

        input[type="text"]::placeholder { color:#7e8488; }

        .not-youtube-message { font-size:13px; color:#9aa0a6; text-align:left; margin-bottom:8px; font-weight: 600; }

        /* Button style copied from sidebar - primary pill */
        #DownloadBtn {
            background: linear-gradient(180deg, #26282a 0%, #1f2022 100%);
            color: #f3f4f6;
            border: 1px solid rgba(255,255,255,0.06);
            padding: 12px 18px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 999px;
            cursor: pointer;
            transition: all 180ms cubic-bezier(.2,.9,.3,1);
            min-width: 140px;
            box-shadow: 0 6px 18px rgba(10,10,10,0.45);
            letter-spacing: normal;
            display: block;
            margin: 0 auto;
            text-transform: uppercase;
        }
        #DownloadBtn:hover { transform: translateY(-3px); box-shadow: 0 10px 26px rgba(10,10,10,0.55); }
        #DownloadBtn:active { transform: translateY(0); box-shadow: 0 6px 18px rgba(8,8,8,0.45); opacity: 0.98; }
        #DownloadBtn:disabled { background: rgba(255,255,255,0.02); color: #8b8f92; border-color: rgba(255,255,255,0.02); cursor:not-allowed; box-shadow:none; }

        /* Result pill - copy visual from sidebar */
        #result {
            background: rgba(255,255,255,0.01);
            border-radius: 12px;
            padding: 10px 12px;
            min-height: 40px;
            font-size: 13px;
            border: 1px solid rgba(255,255,255,0.03);
            display: none;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 180ms ease, transform 180ms ease;
        }
        #result.show { display:block; opacity:1; transform:translateY(0); }
        #result::before { content:''; width:10px; height:10px; border-radius:50%; background:var(--result-color,#4a90e2); flex:0 0 auto; box-shadow:0 2px 6px rgba(0,0,0,0.5); }
        #result.success { --result-color:#2ecc71; color:#bfecc8; border-color: rgba(46,204,113,0.08); }
        #result.error { --result-color:#ff6b6b; color:#ffd6d6; border-color: rgba(255,107,107,0.08); }
        #result.warning { --result-color:#f39c12; color:#ffecc5; border-color: rgba(243,156,18,0.08); }
        #result.info { --result-color:#4a90e2; color:#cfe9ff; border-color: rgba(74,144,226,0.08); }

        .loader { display:none; width:20px; height:20px; border:3px solid rgba(255,255,255,0.06); border-top:3px solid #cfd6da; border-radius:50%; animation:spin 1s linear infinite; margin:10px auto; }
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

        /* hide url input container by default (kept from original popup) */
        .url-input-container { display: none; }
        .url-input-container.show { display:block; }

    </style>
</head>
<body>
    <div class="container">
        <h1>YouTube MP3 Downloader</h1>

        <div class="url-container" id="currentUrlContainer">
            <div class="url-label">Current URL</div>
            <div class="url-text" id="currentUrl">Loading...</div>
        </div>

        <div class="url-input-container" id="urlInputContainer">
            <div class="not-youtube-message">Not on YouTube? Paste a YouTube URL below:</div>
            <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=...">
        </div>

        <!-- Use a plain row for folder label+input to avoid the boxed card around it -->
        <div class="folder-row">
            <div class="folder-label">Download Folder (Optional)</div>
            <input type="text" id="folderInput" placeholder="Leave empty for default folder">
        </div>

        <div class="folder-row">
            <div class="folder-label">Filename (Optional)</div>
            <input type="text" id="filenameInput" placeholder="Leave empty to use video title">
        </div>

        <button id="DownloadBtn">Download MP3</button>

        <div class="loader" id="loader"></div>
        <div id="result"></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
