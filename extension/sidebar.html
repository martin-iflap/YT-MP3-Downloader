<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP3 Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
            background: #17181a; /* uniform background to avoid white corners */
        }

        /* Fill whatever width the user gives the sidebar */
        body {
            min-height: 600px; /* allow taller content */
            background: #17181a; /* uniform background to avoid rim/gradient issues */
            font-family: 'SF Pro Text', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 14px;
            color: #e6e6e6;
            overflow: hidden; /* prevent flicker */
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: calc(100vh - 28px);
            overflow-y: auto; /* scroll here if needed */
            scrollbar-width: none; /* firefox */
            -ms-overflow-style: none; /* ie 10+ */
        }
        /* hide webkit scrollbars for container */
        .container::-webkit-scrollbar { display: none; }

        h1 {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            text-align: center;
            margin-bottom: 4px;
        }

        /* Card-like input area */
        .card {
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.04);
            box-shadow: none; /* remove outer rim */
            overflow: visible;
        }

        .current-url-area {
            background: transparent;
            padding: 0;
            border: none;
            box-shadow: none;
        }

        /* Input groups share a consistent modern look */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label.input-label {
            font-size: 10px;
            color: #9aa0a6;
            text-transform: uppercase;
            letter-spacing: normal;
            font-weight: 600;
        }

        .static-url {
            font-size: 12px;
            color: #dcdfe2;
            word-break: break-all;
            line-height: 1.3;
            padding: 6px 8px;
            background: rgba(255,255,255,0.01);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        input[type="text"] {
            width: 100%;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 8px;
            padding: 10px 10px;
            color: #e6e6e6;
            font-size: 13px;
            transition: all 120ms ease;
            outline: none;
            box-shadow: inset 0 -1px 0 rgba(0,0,0,0.25);
        }

        input[type="text"]:focus {
            background: rgba(255,255,255,0.03);
            border-color: rgba(255,255,255,0.08);
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(0,0,0,0.45), 0 0 0 3px rgba(120,130,140,0.03);
        }

        input[type="text"]::placeholder {
            color: #7e8488;
        }

        /* Actions row - stack vertically for narrow sidebar */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: stretch;
            justify-content: flex-start;
            margin-top: 4px;
        }

        /* Pill style used for primary-like actions (Download, Open in app) */
        .action-pill {
            background: linear-gradient(180deg, #26282a 0%, #1f2022 100%);
            color: #f3f4f6;
            border: 1px solid rgba(255,255,255,0.06);
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 999px;
            cursor: pointer;
            transition: all 140ms cubic-bezier(.2,.9,.3,1);
            min-width: 140px;
            box-shadow: 0 6px 18px rgba(10,10,10,0.35);
            letter-spacing: normal;
            margin: 0 auto; /* center in sidebar */
            display: inline-block;
            text-align: center;
        }
        .action-pill:hover { transform: translateY(-2px); }
        .action-pill:active { transform: translateY(0); }
        .action-pill:disabled { opacity: 0.85; cursor: not-allowed; }

        /* Secondary small button - default (full width) */
        .secondary-btn {
            background: transparent;
            color: #d7dadd;
            border: 1px solid rgba(255,255,255,0.04);
            padding: 8px 10px;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 120ms ease;
            width: 100%;
            text-align: left;
        }
        .secondary-btn:hover { background: rgba(255,255,255,0.02); }

        /* Narrow variant for select-folder button (inline next to input) */
        .secondary-narrow {
            width: auto;
            padding: 8px 10px;
            min-width: 72px;
            text-align: center;
        }

        /* Row with input + helper + select button: inline with wrapping so helper can occupy full-width between input and button */
        .input-row {
            display: flex;
            flex-direction: row;
            gap: 8px;
            align-items: center;
            width: 100%;
            flex-wrap: wrap; /* allow helper to break onto its own row */
        }
        .input-row input[type="text"] { order: 1; flex: 1 1 auto; min-width: 0; }
        .input-row .helper { order: 2; flex-basis: 100%; max-height: 0; opacity: 0; overflow: hidden; transition: max-height 160ms ease 0ms, opacity 160ms ease 0ms, padding 160ms ease 0ms; padding: 0 6px; }
        .input-row button { order: 3; flex: 0 0 auto; }
        /* when space is tight, stack vertically */
        @media (max-width: 340px) {
            .input-row { flex-direction: column; }
        }

        /* show only after a short hover delay to avoid accidental triggers
           include both .input-row children and direct .input-group children (URL helper is a direct child) */
        .input-row > input[type="text"]:hover + .helper,
        .input-group > input[type="text"]:hover + .helper,
        .input-row > .helper:hover,
        .input-group > .helper:hover {
            transition-delay: 140ms; /* wait briefly before showing */
            max-height: 48px;
            opacity: 1;
            padding: 8px 6px;
        }

        /* Result pill message */
        #result {
            display: none; /* hidden until a message arrives */
            align-items: center;
            gap: 10px;
            border-radius: 10px;
            padding: 8px 10px;
            min-height: 44px;
            font-size: 13px;
            background: rgba(255,255,255,0.01);
            color: #dfe6e9;
            border: 1px solid rgba(255,255,255,0.03);
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 160ms ease, transform 160ms ease;
        }

        #result.show { display:flex; opacity:1; transform:translateY(0); }

        /* colored indicator dot via ::before — color set via CSS variable */
        #result::before {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--result-color, #4a90e2);
            flex: 0 0 auto;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }

        #result.success { --result-color: #2ecc71; color:#bfecc8; border-color: rgba(46,204,113,0.08); }
        #result.error { --result-color: #ff6b6b; color:#ffd6d6; border-color: rgba(255,107,107,0.08); }
        #result.warning { --result-color: #f39c12; color:#ffecc5; border-color: rgba(243,156,18,0.08); }
        #result.info { --result-color: #4a90e2; color:#cfe9ff; border-color: rgba(74,144,226,0.08); }

        .loader { display:none; width:20px; height:20px; border:3px solid rgba(255,255,255,0.06); border-top:3px solid #cfd6da; border-radius:50%; animation:spin 1s linear infinite; margin:10px auto; }
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

        /* helper: in-flow element that expands (pushes content down) */
        .helper {
            display: block;
            max-height: 48px; /* reduced to avoid large shifts */
            opacity: 0;
            overflow: hidden;
            color: #a8b0b4; /* slightly brighter for readability */
            background: rgba(255,255,255,0.01);
            border-radius: 8px;
            padding: 0 6px;
            font-size: 12px;
            transition: max-height 160ms ease, opacity 160ms ease, padding 160ms ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>YouTube MP3 Downloader</h1>


        <div class="card">
            <div class="input-group">
                <label class="input-label" for="urlInput">YouTube URL</label>
                <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=..." aria-describedby="urlHelp">
                <div id="urlHelp" class="helper">Paste a YouTube link or open a YouTube page</div>
            </div>

            <div class="input-group">
                <label class="input-label" for="folderInput">Default Download Folder</label>
                <div class="input-row">
                    <input type="text" id="folderInput" placeholder="Folder Path" aria-describedby="folderHelp">
                    <div id="folderHelp" class="helper">Default folder used for downloads (also by the right-click menu)</div>
                    <button class="secondary-btn secondary-narrow" id="selectFolderBtn">Choose</button>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label" style="margin-top: 8px;" for="filenameInput">Filename (Optional)</label>
                <input type="text" id="filenameInput" placeholder="Leave empty to use video title" aria-describedby="filenameHelp">
                <div id="filenameHelp" class="helper">Custom filename for the downloaded MP3 file</div>
            </div>

        </div>

        <div class="actions">
            <button id="DownloadBtn" class="action-pill">Download MP3</button>
            <button id="openInAppBtn" class="action-pill">Open in app</button>
         </div>

         <div class="loader" id="loader" aria-hidden="true"></div>
         <div id="result" role="status" aria-live="polite"></div>
     </div>

     <script src="youtube.js"></script>
     <script src="sidebar.js"></script>
</body>
</html>
